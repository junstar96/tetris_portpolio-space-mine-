<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>테트리스 TETRIS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ============ MAIN MENU ============ -->
  <div id="menu-screen" class="screen active">
    <div class="menu-container">
      <div class="title-block">
        <h1 class="game-title">
          <span class="t-red">T</span><span class="t-blue">E</span><span class="t-yellow">T</span><span class="t-green">R</span><span class="t-purple">I</span><span class="t-red">S</span>
        </h1>
        <p class="subtitle">클래식 테트리스 게임</p>
      </div>
      <div class="menu-buttons">
        <button class="btn btn-start" onclick="startGame()">
          <span class="btn-icon">▶</span> 게임 시작
        </button>
        <button class="btn btn-score" onclick="showScores()">
          <span class="btn-icon">🏆</span> 스코어
        </button>
        <button class="btn btn-quit" onclick="quitGame()">
          <span class="btn-icon">✕</span> 게임 종료
        </button>
      </div>
      <div class="menu-footer">
        <p>조작법: ← → 이동 &nbsp;|&nbsp; ↑ 회전 &nbsp;|&nbsp; ↓ 소프트드롭 &nbsp;|&nbsp; Space 하드드롭 &nbsp;|&nbsp; P 일시정지</p>
      </div>
    </div>
    <!-- Decorative falling blocks -->
    <div class="bg-blocks" id="bg-blocks"></div>
  </div>

  <!-- ============ GAME SCREEN ============ -->
  <div id="game-screen" class="screen">
    <div class="game-layout">
      <!-- LEFT PANEL: Score & Time -->
      <div class="side-panel left-panel">
        <div class="panel-box score-box">
          <div class="panel-label">점수</div>
          <div class="panel-value" id="score-display">0</div>
        </div>
        <div class="panel-box level-box">
          <div class="panel-label">레벨</div>
          <div class="panel-value" id="level-display">1</div>
        </div>
        <div class="panel-box lines-box">
          <div class="panel-label">라인</div>
          <div class="panel-value" id="lines-display">0</div>
        </div>
        <div class="panel-box time-box">
          <div class="panel-label">플레이 타임</div>
          <div class="panel-value" id="time-display">0초</div>
        </div>
        <div class="panel-box hold-box">
          <div class="panel-label">홀드 (C)</div>
          <canvas id="hold-canvas" width="100" height="100"></canvas>
        </div>
      </div>

      <!-- CENTER: Game Board -->
      <div class="board-wrapper">
        <canvas id="game-canvas"></canvas>
        <div id="pause-overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2>일시정지</h2>
            <button class="btn btn-resume" onclick="resumeGame()">계속하기</button>
            <button class="btn btn-menu" onclick="backToMenu()">메뉴로</button>
          </div>
        </div>
        <div id="gameover-overlay" class="overlay hidden">
          <div class="overlay-content gameover-content">
            <h2>게임 오버</h2>
            <div class="final-stats">
              <p>점수: <span id="final-score">0</span></p>
              <p>레벨: <span id="final-level">1</span></p>
              <p>라인: <span id="final-lines">0</span></p>
              <p>시간: <span id="final-time">0초</span></p>
            </div>
            <div class="name-input-group">
              <input type="text" id="player-name" placeholder="이름 입력" maxlength="20" value="Player" />
            </div>
            <button class="btn btn-save" onclick="saveScore()">저장 & 메뉴</button>
            <button class="btn btn-retry" onclick="startGame()">다시하기</button>
          </div>
        </div>
      </div>

      <!-- RIGHT PANEL: Next Pieces -->
      <div class="side-panel right-panel">
        <div class="panel-box next-box">
          <div class="panel-label">다음 블록</div>
          <canvas id="next-canvas-0" width="100" height="100"></canvas>
        </div>
        <div class="panel-box next-box">
          <canvas id="next-canvas-1" width="100" height="100"></canvas>
        </div>
        <div class="panel-box next-box">
          <canvas id="next-canvas-2" width="100" height="100"></canvas>
        </div>
        <div class="controls-hint">
          <button class="btn btn-pause-small" onclick="togglePause()">⏸ 일시정지</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ SCORE SCREEN ============ -->
  <div id="score-screen" class="screen">
    <div class="score-container">
      <h2 class="score-title">🏆 스코어 보드</h2>
      <div class="score-table-wrapper">
        <table class="score-table">
          <thead>
            <tr>
              <th>순위</th>
              <th>이름</th>
              <th>점수</th>
              <th>레벨</th>
              <th>라인</th>
              <th>시간</th>
            </tr>
          </thead>
          <tbody id="score-tbody">
            <tr><td colspan="6" class="empty-score">기록이 없습니다</td></tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-back" onclick="showMenu()">← 메뉴로 돌아가기</button>
    </div>
  </div>

  <!-- ============ QUIT SCREEN ============ -->
  <div id="quit-screen" class="screen">
    <div class="quit-container">
      <h2>👋 감사합니다!</h2>
      <p>테트리스를 플레이해주셔서 감사합니다.</p>
      <button class="btn btn-back" onclick="showMenu()">← 돌아가기</button>
    </div>
  </div>

  <script src="tetris.js"></script>
</body>
</html>
